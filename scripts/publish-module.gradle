apply plugin: 'maven-publish'
apply plugin: 'signing'

group = PUBLISH_GROUP_ID
version = PUBLISH_VERSION

def isPublishToMavenLocal = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("publishtomavenlocal")
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = PUBLISH_GROUP_ID
                artifactId = PUBLISH_ARTIFACT_ID
                version = PUBLISH_VERSION

                pom {
                    packaging = 'aar'

                    name = PUBLISH_ARTIFACT_ID
                    description = PUBLISH_DESCRIPTION
                    url = PUBLISH_URL

                    licenses {
                        license {
                            name = PUBLISH_LICENSE_NAME
                            url = PUBLISH_LICENSE_URL
                        }
                    }

                    developers {
                        developer {
                            id = PUBLISH_DEVELOPER_ID
                            name = PUBLISH_DEVELOPER_NAME
                            email = PUBLISH_DEVELOPER_EMAIL
                        }
                    }

                    scm {
                        connection = PUBLISH_SCM_CONNECTION
                        developerConnection = PUBLISH_SCM_DEVELOPER_CONNECTION
                        url = PUBLISH_SCM_URL
                    }
                }
            }
        }
    }

    def hasSigningKeys = [
            project.findProperty("signing.keyId"),
            project.findProperty("signing.password"),
            project.findProperty("signing.secretKeyRingFile")
    ].every {
        it != null && it.toString().trim().length() > 0
    }

    def shouldSign = hasSigningKeys &&
            !isPublishToMavenLocal &&
            !version.toString().endsWith("SNAPSHOT")

    if (shouldSign) {
        signing {
            sign publishing.publications.release
        }
    }

    tasks.withType(Sign).configureEach {
        enabled = shouldSign
    }
}
